# ============================================
# TontineClub — Docker Compose Production (VPS TMBSAAS partage)
# Architecture: nginx-proxy central (existant sur le VPS) + FastAPI + MongoDB Atlas
# Pas de nginx/certbot ici: geres de facon centralisee par nginx-proxy sur le VPS.
# ============================================

services:
  tontineclub-backend:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    container_name: tontineclub-backend
    restart: always
    env_file:
      - .env
    ports:
      - "8016:8000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "5"

  tontineclub-frontend:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.frontend
      args:
        EXPO_PUBLIC_BACKEND_URL: "https://tontineclub.tmbsaas.com"
    container_name: tontineclub-frontend
    restart: always
    ports:
      - "3016:3000"
    logging:
      driver: "json-file"
      options:
        max-size: "5m"
        max-file: "3"
