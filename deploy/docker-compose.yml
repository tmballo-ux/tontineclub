# ============================================
# TontineClub — Docker Compose Production
# Architecture: Nginx + FastAPI + MongoDB Atlas
# ============================================

version: '3.8'

services:
  # ==========================================
  # API Backend (FastAPI)
  # ==========================================
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: tontineclub-api
    restart: always
    env_file:
      - .env.production
    ports:
      - "8001:8001"
    networks:
      - tontineclub-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "5"

  # ==========================================
  # Nginx Reverse Proxy + SSL
  # ==========================================
  nginx:
    image: nginx:1.25-alpine
    container_name: tontineclub-nginx
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/api.conf:/etc/nginx/conf.d/api.conf:ro
      - ./certbot/conf:/etc/letsencrypt:ro
      - ./certbot/www:/var/www/certbot:ro
    depends_on:
      api:
        condition: service_healthy
    networks:
      - tontineclub-network
    logging:
      driver: "json-file"
      options:
        max-size: "5m"
        max-file: "3"

  # ==========================================
  # Certbot (SSL Let's Encrypt)
  # ==========================================
  certbot:
    image: certbot/certbot
    container_name: tontineclub-certbot
    volumes:
      - ./certbot/conf:/etc/letsencrypt
      - ./certbot/www:/var/www/certbot
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew; sleep 12h & wait $${!}; done;'"
    networks:
      - tontineclub-network

networks:
  tontineclub-network:
    driver: bridge
    name: tontineclub-network
